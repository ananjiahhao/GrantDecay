<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is access review, comparing what was granted
  against what was used. Granted permission counts use a neutral slate #334155
  (the baseline, the status quo). Exercised counts use green #15803d (active,
  legitimate use). The single accent amber #b45309 marks the unused gap, the one
  thing a reviewer should look at first. Two core colours plus one accent, no
  AI-default indigo or violet, flat fills only.

  Numbers: taken verbatim from `python -m grantdecay surface` against
  samples/entitlements.txt and samples/accesslog.txt in this session.
  svc-batch granted=2 exercised=0; svc-finance granted=2 exercised=2;
  svc-oncall granted=2 exercised=2; svc-web granted=5 exercised=4.

  Motion: none. A static bar chart reads correctly on a README.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="title desc" width="480" height="300">
  <title id="title">Granted versus exercised permissions per principal</title>
  <desc>Grouped bar chart. For each of four principals a slate bar shows granted
    permission count and a green bar shows exercised count. svc-batch has 2
    granted and 0 exercised, so its full grant is dormant. svc-finance 2 and 2,
    svc-oncall 2 and 2, svc-web 5 granted and 4 exercised with one unused. The
    amber tick marks the unused gap on svc-web and svc-batch.</desc>

  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>

  <!-- Axes. x baseline at y=250, y axis at x=64. Scale: 40px per permission. -->
  <line x1="64" y1="40" x2="64" y2="250" stroke="#94a3b8" stroke-width="1"/>
  <line x1="64" y1="250" x2="440" y2="250" stroke="#94a3b8" stroke-width="1"/>

  <!-- y gridline labels at 0, 2, 4 permissions (40px each). -->
  <text x="56" y="254" text-anchor="end" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#475569">0</text>
  <text x="56" y="174" text-anchor="end" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#475569">2</text>
  <text x="56" y="94" text-anchor="end" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#475569">4</text>
  <text x="16" y="149" font-size="11" transform="rotate(-90 16 149)"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#475569">permissions</text>

  <!-- svc-batch: granted 2 (h=80), exercised 0. group centre x=112 -->
  <rect x="88" y="170" width="20" height="80" fill="#334155"/>
  <rect x="112" y="250" width="20" height="0" fill="#15803d"/>
  <!-- unused gap accent: full 2 unused -->
  <rect x="86" y="170" width="24" height="3" fill="#b45309"/>
  <text x="110" y="266" text-anchor="middle" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#0f172a">svc-batch</text>

  <!-- svc-finance: granted 2 (h=80), exercised 2 (h=80). group centre x=200 -->
  <rect x="176" y="170" width="20" height="80" fill="#334155"/>
  <rect x="200" y="170" width="20" height="80" fill="#15803d"/>
  <text x="198" y="266" text-anchor="middle" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#0f172a">svc-finance</text>

  <!-- svc-oncall: granted 2 (h=80), exercised 2 (h=80). group centre x=288 -->
  <rect x="264" y="170" width="20" height="80" fill="#334155"/>
  <rect x="288" y="170" width="20" height="80" fill="#15803d"/>
  <text x="286" y="266" text-anchor="middle" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#0f172a">svc-oncall</text>

  <!-- svc-web: granted 5 (h=200), exercised 4 (h=160). group centre x=376 -->
  <rect x="352" y="50" width="20" height="200" fill="#334155"/>
  <rect x="376" y="90" width="20" height="160" fill="#15803d"/>
  <!-- unused gap accent: 1 unused between exercised top (90) and granted top (50) -->
  <rect x="350" y="50" width="24" height="3" fill="#b45309"/>
  <text x="374" y="266" text-anchor="middle" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#0f172a">svc-web</text>

  <!-- Legend, top right, baselines aligned. -->
  <rect x="300" y="24" width="12" height="12" fill="#334155"/>
  <text x="318" y="34" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#0f172a">granted</text>
  <rect x="372" y="24" width="12" height="12" fill="#15803d"/>
  <text x="390" y="34" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#0f172a">exercised</text>
  <rect x="300" y="8" width="12" height="3" fill="#b45309"/>
  <text x="318" y="14" font-size="11"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        fill="#0f172a">unused gap</text>
</svg>

