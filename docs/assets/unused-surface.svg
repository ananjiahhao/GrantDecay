<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is access review, comparing what was granted
  against what was used. Granted permission counts use a neutral slate #334155
  (the baseline, the status quo). Exercised counts use green #15803d (active,
  legitimate use). The single accent amber #b45309 marks the unused gap, the one
  thing a reviewer should look at first. Two core colours plus one accent, no
  AI-default indigo or violet, flat fills only.

  Numbers: taken verbatim from `python -m grantdecay surface` against
  samples/entitlements.txt and samples/accesslog.txt in this session.
  svc-batch granted=2 exercised=0; svc-finance granted=2 exercised=2;
  svc-oncall granted=2 exercised=2; svc-web granted=5 exercised=4.

  Motion: none. A static bar chart reads correctly on a README.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="title desc" width="480" height="300">
  <title id="title">Granted versus exercised permissions per principal</title>
  <desc>Grouped bar chart. For each of four principals a slate bar shows granted
    permission count and a green bar shows exercised count. svc-batch has 2
    granted and 0 exercised, so its full grant is dormant. svc-finance 2 and 2,
    svc-oncall 2 and 2, svc-web 5 granted and 4 exercised with one unused. The
    amber tick marks the unused gap on svc-web and svc-batch.</desc>
