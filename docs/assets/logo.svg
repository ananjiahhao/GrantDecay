<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: same family as the diagram. The wordmark splits the compound
  name at its morpheme boundary: "grant" in neutral slate #334155 (the
  privilege as issued) and "decay" in amber #b45309, the accent the diagram uses
  to mark unused surface. The split says the tool watches granted privilege lose
  relevance over time. One ink, one accent, no third colour. No mark is added
  because the tool's core output is a list of findings, which a wordmark
  represents honestly without inventing geometry.

  Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img"
     aria-labelledby="title desc" width="240" height="96">
  <title id="title">grantdecay logo</title>
  <desc>Wordmark reading grantdecay, with "grant" in slate ink and "decay" in
    amber, split at the compound word boundary.</desc>

  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>

  <text x="16" y="56"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="26" font-weight="600" fill="#334155">grant<tspan fill="#b45309">decay</tspan></text>
  <text x="16" y="78"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#475569">granted privilege, never used</text>
</svg>

