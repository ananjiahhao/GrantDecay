<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: granted privilege losing relevance over time. Slate lifted to
  #cbd5e1 carries the structural ink on #0d1117; the single accent, amber lifted
  to #e0a458, marks the decay half and the unused verdict, the thing the reader
  looks at first. Green marks a used verdict only, as a state with a label.
  Contrast on #0d1117: ink 13.4:1, amber 9.1:1, muted 6.3:1, green 8.1:1.
  Grid: every edge and baseline on a multiple of 4. No glow, no blur, no
  gradients as decoration. Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img"
     aria-labelledby="bannerTitle bannerDesc" width="1400" height="360">
  <title id="bannerTitle">GrantDecay banner</title>
  <desc id="bannerDesc">GrantDecay finds privilege that was granted and never used.
    A verdicts card lists principals with granted dates and used, unused, or
    unknown verdicts over an observation window.</desc>

  <rect x="0" y="0" width="1400" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="64" y="120" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="700"><tspan fill="#cbd5e1">grant</tspan><tspan fill="#e0a458">decay</tspan></text>

  <text x="64" y="168" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3">Find privilege that was granted and never used</text>
  <text x="64" y="200" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Entitlements. Access windows. Deterministic verdicts.</text>

  <rect x="64" y="248" width="104" height="36" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="116" y="271" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">v1.0.3</text>
  <rect x="184" y="248" width="80" height="36" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="224" y="271" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">MIT</text>
  <rect x="280" y="248" width="168" height="36" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="364" y="271" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">Python 3.11+</text>

  <rect x="800" y="56" width="536" height="248" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="832" y="96" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#8b949e">window 2026-06-01 to 2026-07-01</text>
  <line x1="832" y1="112" x2="1304" y2="112" stroke="#30363d" stroke-width="1"/>

  <circle cx="840" cy="144" r="6" fill="#3fb950"/>
  <text x="864" y="150" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">ana    granted 2025-02-11   used</text>

  <circle cx="840" cy="192" r="6" fill="#e0a458"/>
  <text x="864" y="198" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">build  granted 2024-08-03   unused 312d</text>

  <circle cx="840" cy="240" r="6" fill="#e0a458"/>
  <text x="864" y="246" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">ops    granted 2023-11-27   unused 561d</text>

  <circle cx="840" cy="288" r="6" fill="#8b949e"/>
  <text x="864" y="294" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">svc    granted 2026-05-02   unknown</text>
</svg>
