<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the access review chart from the repository diagram. Slate
  lifted to #cbd5e1 is granted surface, green lifted to #3fb950 is exercised
  surface, and the single accent, amber lifted to #e0a458, marks the unused gap
  on each row. Neutrals carry the structure. Contrast on #0d1117: ink 13.4:1,
  green 8.1:1, amber 9.1:1, muted 6.3:1.
  Scale: 48px per permission, every bar 20 tall, one corner radius reused.
  Grid: every edge and baseline on a multiple of 4. No glow, no blur, no
  gradients as decoration. Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img"
     aria-labelledby="bannerTitle bannerDesc" width="1400" height="360">
  <title id="bannerTitle">GrantDecay banner</title>
  <desc id="bannerDesc">GrantDecay, granted versus exercised permissions per
    principal. Four rows show the granted surface, the exercised subset, and the
    unused gap in amber. The batch service has no exercised permissions.</desc>

  <rect x="0" y="0" width="1400" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="64" y="84" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700"><tspan fill="#cbd5e1">grant</tspan><tspan fill="#e0a458">decay</tspan></text>
  <text x="64" y="130" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3">Find privilege that was granted and never used</text>
  <text x="64" y="158" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Entitlements. Access windows. Deterministic verdicts.</text>

  <text x="964" y="84" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">v1.0.3</text>
  <text x="1054" y="84" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">MIT</text>
  <text x="1114" y="84" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">Python 3.11+</text>

  <text x="700" y="84" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">window 2026-06-01 to 2026-07-01</text>

  <line x1="64" y1="182" x2="1336" y2="182" stroke="#30363d" stroke-width="1"/>

  <rect x="900" y="196" width="16" height="16" rx="4" fill="#cbd5e1"/>
  <text x="924" y="209" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">granted</text>
  <rect x="1040" y="196" width="16" height="16" rx="4" fill="#3fb950"/>
  <text x="1064" y="209" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">exercised</text>
  <rect x="1196" y="196" width="16" height="16" rx="4" fill="#e0a458"/>
  <text x="1220" y="209" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">unused</text>

  <text x="64" y="239" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#cbd5e1">svc-batch</text>
  <rect x="240" y="224" width="96" height="20" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="240" y="224" width="96" height="20" rx="4" fill="#e0a458" opacity="0.4"/>
  <text x="368" y="239" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#e0a458">granted 2, exercised 0</text>

  <text x="64" y="273" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#cbd5e1">svc-finance</text>
  <rect x="240" y="258" width="96" height="20" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="240" y="258" width="96" height="20" rx="4" fill="#3fb950" opacity="0.55"/>
  <text x="368" y="273" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">granted 2, exercised 2</text>

  <text x="64" y="307" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#cbd5e1">svc-oncall</text>
  <rect x="240" y="292" width="96" height="20" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="240" y="292" width="96" height="20" rx="4" fill="#3fb950" opacity="0.55"/>
  <text x="368" y="307" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">granted 2, exercised 2</text>

  <text x="64" y="341" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#cbd5e1">svc-web</text>
  <rect x="240" y="326" width="240" height="20" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="240" y="326" width="192" height="20" rx="4" fill="#3fb950" opacity="0.55"/>
  <rect x="432" y="326" width="48" height="20" rx="4" fill="#e0a458" opacity="0.4"/>
  <text x="512" y="341" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">granted 5, exercised 4, one unused</text>
</svg>
